<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plantão · Clínica Vida (demo)</title>
<style>
:root{
  --bg:#081209; --panel:#0F2015; --panel2:#132A1B; --green:#2EBD6B; --mint:#8FE3B4;
  --white:#F4F7F4; --dim:rgba(238,244,239,.78); --faint:rgba(238,244,239,.5);
  --line:rgba(238,244,239,.14); --ink:#06130B;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color:var(--white);display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line)}
header{padding:14px 18px;background:var(--panel);display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--green);color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:.02em}
.htxt .nm{font-weight:700;font-size:15.5px}
.htxt .st{font-size:12px;color:var(--mint)}
header .reset{margin-left:auto;background:none;border:1px solid var(--line);color:var(--faint);
  font-size:12px;padding:6px 10px;border-radius:6px;cursor:pointer}
#log{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:10px;font-size:14.5px;line-height:1.45;white-space:pre-wrap}
.msg.user{background:var(--green);color:var(--ink);align-self:flex-end;border-bottom-right-radius:3px;font-weight:500}
.msg.bot{background:var(--panel2);align-self:flex-start;border-bottom-left-radius:3px}
.msg.sys{align-self:center;background:none;color:var(--faint);font-size:12px;text-align:center;max-width:92%}
.typing{align-self:flex-start;color:var(--faint);font-size:13px;padding:4px 14px}
form{display:flex;gap:10px;padding:12px 14px;background:var(--panel);border-top:1px solid var(--line)}
input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--white);
  font-size:14.5px;padding:11px 14px;outline:none}
input:focus{border-color:var(--green)}
button.send{background:var(--green);border:none;border-radius:8px;width:46px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
button.send svg{width:20px;height:20px;stroke:var(--ink)}
footer{padding:8px 14px 12px;background:var(--panel);font-size:11px;color:var(--faint);text-align:center}
footer b{color:var(--mint);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="avatar">CV</div>
    <div class="htxt">
      <div class="nm">Clínica Vida</div>
      <div class="st">Plantão · responde em segundos</div>
    </div>
    <button class="reset" id="reset" type="button">Nova conversa</button>
  </header>
  <div id="log"></div>
  <form id="f">
    <input id="inp" autocomplete="off" placeholder="Escreva como um paciente escreveria..." maxlength="2000">
    <button class="send" type="submit" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
    </button>
  </form>
  <footer>Demonstração do <b>Plantão</b> — clínica fictícia, agenda real. Não é orientação médica.</footer>
</div>
<script>
const log = document.getElementById('log');
const form = document.getElementById('f');
const inp = document.getElementById('inp');
let sid = localStorage.getItem('plantao_sid');
if (!sid) { sid = 'web-' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem('plantao_sid', sid); }

function add(kind, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + kind;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
add('sys', 'Você está falando com o funcionário de IA da Clínica Vida (demo). Experimente: "Oi, vocês atendem dermatologia pela Unimed? Queria marcar uma consulta."');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  add('user', text);
  const t = document.createElement('div');
  t.className = 'typing'; t.textContent = 'digitando...';
  log.appendChild(t); log.scrollTop = log.scrollHeight;
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ session_id: sid, message: text }),
    });
    t.remove();
    if (!r.ok) { add('sys', 'Erro ao enviar (' + r.status + '). Tente de novo.'); return; }
    const data = await r.json();
    add('bot', data.reply);
    if (data.handed_off) add('sys', 'Conversa marcada para atendimento humano.');
  } catch (err) {
    t.remove();
    add('sys', 'Falha de conexão. Tente de novo.');
  }
});
document.getElementById('reset').addEventListener('click', () => {
  localStorage.removeItem('plantao_sid'); location.reload();
});
</script>
</body>
</html>
